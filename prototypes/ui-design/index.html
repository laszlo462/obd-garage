<title>PROTOTYPE · OBD Garage UI</title>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "UI design: DESIGN.md and screen inventory".
  Question: what should v0.1 look like? Three visual directions on the decided Variant D shell
  (bottom tab bar, one responsive layout), each rendering the whole screen inventory:
    A  Grouped     calm iOS-style inset grouped lists
    B  Instrument  dense, dark-first, monospaced numbers, tell-tale status
    C  Cards       warm, bold cards, big numbers, a coloured status hero
  Round 2 (A won round 1; B and C stay reachable by URL only), researched references to weigh against A:
    D  Flighty     "departure board": big condensed numerals, caps captions, status words with deltas
    E  Material 3  tonal surface containers, pill chips, 28 px sheets, Roboto Flex
    F  Grafana     flat 1 px panels, stat tiles with sparklines, dense rows, mono values
  These imitate a look only (no assets, logos or names in the UI). See research/mobile-design-references.
  Switch with ?variant=A|B|C, the floating pill, or ← →. "☰ screens" in the pill jumps anywhere.
  All data is synthetic (fake VIN, made-up drives). Nothing is saved. Chart gestures are only a
  one-finger scrub here; the real gestures were settled by the notes-pinning prototype.
-->

/* ================= base ================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 var(--fs-md)/1.4 var(--font-ui); min-height: 100dvh; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, label, input, select, summary { touch-action: manipulation; }   /* no double-tap zoom on iOS */
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .ink2 { color: var(--ink2); }
.sm { font-size: var(--fs-sm); } .xs { font-size: var(--fs-xs); }
a { color: var(--accent); }

/* app bar */
.appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 8px) 8px 8px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid transparent; min-height: 52px; }
.appbar.scrolled, [data-v=B] .appbar { border-bottom-color: var(--line); }
.appbar .ttl { flex: 1; min-width: 0; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { border: 0; background: none; padding: 8px; border-radius: var(--r-ctl); color: var(--accent); display: inline-flex; align-items: center; gap: 4px; position: relative; min-height: 40px; }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn .dot { position: absolute; top: 7px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); border: 2px solid var(--bg); }
.vswitch { border: 0; background: none; display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: var(--r-ctl); font-weight: 600; color: var(--ink); max-width: 70vw; }
.vswitch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vswitch svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.desknav { display: none; }

main { padding: 0 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 70px); }
main.detail { padding-bottom: calc(env(safe-area-inset-bottom) + 130px); }
.wrap { max-width: 760px; margin: 0 auto; }
.wrap.wide { max-width: 1180px; }
h1.big { font: 700 var(--fs-title)/1.15 var(--font-display); margin: 4px var(--gut) 12px; letter-spacing: -.01em; }
.sec { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--muted); padding: 18px var(--gut) 6px; display: flex; align-items: baseline; gap: 8px; }
.sec .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: var(--fs-sm); }
.sec button.r { border: 0; background: none; color: var(--accent); padding: 0; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; font-size: 10.5px; color: var(--muted); height: var(--tabbar-h); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-selected=true] { color: var(--accent); }
.tabbar .add .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.tabbar .add .plus svg { width: 20px; height: 20px; }
[data-v=B] .tabbar .add .plus { border-radius: 3px; }

/* groups / cells */
.group { margin: 0 var(--gut); background: var(--surface); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow); }
.cell { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: var(--cell-y) var(--gut); position: relative; color: var(--ink); min-height: 44px; }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--sep-left, var(--gut)); border-top: 1px solid var(--line); }
.cell .tx { flex: 1; min-width: 0; } .cell .tx b { display: block; font-weight: 600; } .cell .tx small { color: var(--muted); font-size: var(--fs-sm); display: block; }
.chev { color: var(--muted); width: 16px; height: 16px; flex: none; }
.cell .val { color: var(--muted); font-size: var(--fs-sm); text-align: right; }
.cell:active { background: var(--surface2); }
.kind { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; letter-spacing: .02em; }
.kind.r { background: var(--warn-t); color: var(--warn); } .kind.l { background: var(--accent-t); color: var(--accent); } .kind.x { background: var(--bad-t); color: var(--bad); }
.kind svg { width: 18px; height: 18px; }
.group.list { --sep-left: 62px; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 600; padding: 1px 7px; border-radius: var(--r-pill); background: var(--surface2); color: var(--ink2); white-space: nowrap; vertical-align: 1px; }
.badge.bad { background: var(--bad-t); color: var(--bad); } .badge.warn { background: var(--warn-t); color: var(--warn); } .badge.ok { background: var(--ok-t); color: var(--ok); } .badge.acc { background: var(--accent-t); color: var(--accent); }
.badge.count { background: var(--bad); color: #fff; min-width: 20px; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--accent); padding: 9px 14px; border-radius: var(--r-ctl); font-weight: 600; min-height: 40px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.card { margin: 0 var(--gut) 12px; background: var(--surface); border-radius: var(--r-card); padding: 14px var(--gut); box-shadow: var(--shadow); }
.card h3 { margin: 0 0 8px; font: 600 var(--fs-md)/1.3 var(--font-display); display: flex; align-items: center; gap: 8px; }
.card h3 .r { margin-left: auto; font: 500 var(--fs-sm) var(--font-ui); }
.note-text { white-space: pre-wrap; }

/* status card variants */
.status { margin: 0 var(--gut) 4px; background: var(--surface); border-radius: var(--r-card); padding: 14px var(--gut); display: flex; gap: 12px; align-items: flex-start; box-shadow: var(--shadow); width: calc(100% - 2 * var(--gut)); border: 0; text-align: left; color: var(--ink); }
.status .lamp { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--bad-t); color: var(--bad); }
.status .lamp svg { width: 24px; height: 24px; }
.status b { display: block; font-size: var(--fs-lg); } .status p { margin: 2px 0 0; color: var(--ink2); font-size: var(--fs-sm); }
.status .facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
/* B: tell-tale cluster */
.cluster { margin: 10px var(--gut) 4px; display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); width: calc(100% - 2 * var(--gut)); padding: 0; text-align: left; color: var(--ink); border-radius: var(--r-card); }
.cluster > div { padding: 10px 10px 9px; border-right: 1px solid var(--line); min-width: 0; }
.cluster > div:last-child { border-right: 0; }
.cluster .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cluster .v { font: 600 26px/1.1 var(--font-num); margin-top: 4px; }
.cluster .v.bad { color: var(--bad); } .cluster .v.warn { color: var(--warn); }

.notebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; align-items: center; gap: 8px; padding: 8px var(--gut) calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }

      else s += `<rect x="${x}" y="0" width="${w}" height="${H}" fill="var(--ev-generic)"/>`;

    if (!un) for (const k of p) if (FF[k] != null) s += `<line x1="0" x2="${W}" y1="${Y(FF[k])}" y2="${Y(FF[k])}" stroke="var(${CH[k].c})" stroke-width="1.2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke" opacity=".85"/>`;
    for (const k of p) {

  html += `<div class="xaxis">${[0, .25, .5, .75, 1].map((f) => `<span>${hms(f * tmax).slice(0, 5)}</span>`).join("")}</div>`;

  const seek = (ev) => { const r = box.getBoundingClientRect(); const f = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)); S.cur = Math.round(f * (N - 1)); updateCursor(); };
  let lock = null, sx = 0, sy = 0;
  box.onpointerdown = (e) => { if (e.target.closest(".pin")) { lock = "pin"; return; } lock = e.pointerType === "mouse" ? "x" : null; sx = e.clientX; sy = e.clientY; if (lock) { seek(e); box.setPointerCapture(e.pointerId); } };

  box.onpointerup = (e) => { if (lock === null) seek(e); lock = null; };

  document.querySelectorAll(".notebar .step").forEach((b) => {

function updateCursor() {

  const ro = $("#readout");
  if (ro) ro.innerHTML = `<div class="time">${hms(t)}<small>+${mmss(t)}</small><small>${inWin ? '<span class="inwin">● In window</span>' : pinJ >= 0 ? '<span class="notehit">● Note</span>' : "&nbsp;"}</small></div>
    <div class="vals">${Object.entries(CH).filter(([k]) => S.on[k]).map(([k, c]) => `<span><i style="background:var(${c.c})"></i><b>${c.v[i].toFixed(c.dp)}</b><span class="u">${c.unit}</span></span>`).join("")}</div>`;
  document.querySelectorAll("#chartbox .panel").forEach((p) => { const lo = +p.dataset.lo, hi = +p.dataset.hi;
    p.querySelectorAll(".dots i").forEach((d) => { const y = 100 - 4 - ((CH[d.dataset.k].v[i] - lo) / (hi - lo)) * 82; d.style.left = f / 10 + "%"; d.style.top = y + "%"; }); });
  document.querySelectorAll("#chartbox .pin").forEach((p) => p.classList.toggle("on", +p.dataset.j === pinJ));
  const nb = $("#nbMain");
  if (nb) { nb.classList.toggle("open", pinJ >= 0); nb.dataset.act = pinJ >= 0 ? "opennote" : "note"; nb.dataset.j = pinJ;
    nb.innerHTML = pinJ >= 0 ? `Open Note <span>${hms(PINS[pinJ].t)}</span>` : `Note here <span>${hms(t)}</span>`; }
  const dt = $("#dtable");
  if (dt) { const ks = Object.keys(CH).filter((k) => S.on[k]); const a = Math.max(0, i - 4), b = Math.min(N, i + 5);
    dt.innerHTML = `<table class="dt"><tr><th>Time</th>${ks.map((k) => `<th>${esc(CH[k].label.split(" ").slice(0, 2).join(" "))}</th>`).join("")}</tr>${Array.from({ length: b - a }, (_, j) => a + j).map((r) => `<tr class="${r === i ? "cur" : ""}"><td>${hms(T[r])}</td>${ks.map((k) => `<td>${CH[k].v[r]}</td>`).join("")}</tr>`).join("")}</table>`; }
}

    more: () => `${head(S.route === "report" ? "Diagnostic Report" : "Drive Log")}<div class="group">
      ${S.route === "log" ? `<button class="cell" data-act="assign"><span class="tx"><b>Change Vehicle…</b><small>Regenerates Events, keeps Notes</small></span>${I.chev}</button>` : ""}
      <button class="cell" data-act="export" data-scope="vehicle"><span class="tx"><b>Export this day…</b></span>${I.chev}</button>
      <button class="cell" data-act="toast" data-m="Downloads the Original"><span class="tx"><b>Download original</b></span></button>
      <button class="cell" data-act="toast" data-m="Delete? Removes the Original, parsed data, Events and Notes." style="color:var(--bad)"><span class="tx"><b>Delete…</b></span></button></div>`,
    delveh: () => { const v = VEHICLES.find((x) => x.id === s.id); return `${head(`Delete ${esc(v.label)}?`, "Cancel")}<p class="lede">Removes its ${v.reports} Diagnostic Reports and their Notes. Its ${v.logs} Drive Logs become Unassigned.</p>
      <div class="group"><label class="cell"><input type="checkbox" class="check"><span class="tx"><b>Also delete its ${v.logs} Drive Logs</b><small>And their Notes</small></span></label></div>
      <div class="foot"><button class="btn block" style="background:var(--bad);color:#fff;border:0" data-act="close">Delete vehicle</button></div>`; },
    assign: () => `${head("Assign to…", "Cancel")}<div class="group">${VEHICLES.map((v) => `<label class="cell"><span class="tx"><b>${esc(v.label)}</b><small class="num">…${v.vin.slice(-4)}</small></span><input type="radio" class="radio" name="as" ${v.id === S.veh ? "checked" : ""}></label>`).join("")}</div>
      <p class="lede" style="margin-top:10px">Events are regenerated with the Vehicle's Profile and Rule Packs. Notes are kept.</p><div class="foot"><button class="btn primary block" data-act="toast" data-m="Assigned">Assign</button></div>`,
  }[s.name];
  L.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog">${body()}</div></div>`;
}

// --- upload simulation (Reports first, then one Vehicle question, then results, then New vehicle) ---
async function sim(kind) {
  const step = (i, n, file) => new Promise((r) => { sheet("progress", { i, n, file }); setTimeout(r, 380); });
  if (kind === "mixed") {
    await step(1, 4, "2026-10-06_report.html");
    sheet("which", { n: 3, newV: true, after: async () => { for (let i = 2; i <= 4; i++) await step(i, 4, `2026-10-06_0${i}48.csv`);
      sheet("result", { title: "4 files added", next: true, rows: [["ok", "2026-10-06_report.html", "New vehicle: 2015 Toyota Tacoma"], ["ok", "2026-10-06_0248.csv", "Drive Log · 2015 Toyota Tacoma"], ["ok", "2026-10-06_0348.csv", "Drive Log · 2015 Toyota Tacoma"], ["ok", "2026-10-06_0448.csv", "Drive Log · 2015 Toyota Tacoma"]] }); } });
  } else if (kind === "logs") {
    sheet("which", { n: 3, after: async () => { for (let i = 1; i <= 3; i++) await step(i, 3, `2026-10-0${i + 6}_1722.csv`);
      sheet("result", { title: "3 Drive Logs added", rows: [1, 2, 3].map((i) => ["ok", `2026-10-0${i + 6}_1722.csv`, `Drive Log · ${veh().label}`]) }); } });
  } else {
    sheet("which", { n: 3, after: async () => { for (let i = 1; i <= 5; i++) await step(i, 5, `file ${i}`);
      sheet("result", { title: "2 added, 3 not", rows: [["warn", "2026-10-08_0715.csv", "Added · 12 rows skipped"], ["warn", "2026-10-08_0731.csv", "Added · overlaps the 07:15 drive on this Vehicle"], ["bad", "2026-10-08_0901.csv", "Failed Upload · no StartTime line. Kept under Failed Uploads"], ["ref", "2026-10-04_1722.csv", "Already added (same file). Open it"], ["ref", "IMG_2231.jpg", "Refused · not an OBDLink report or Drive Log"]] }); } });
  }
}

// ===================================================================================
// events
// ===================================================================================
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]");
  if (g) { if (g.dataset.id) S.vid = g.dataset.id; go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const k = a.dataset.act;
  if (k === "scrim") { if (e.target === a) sheet(null); return; }
  if (k === "back") back();
  else if (k === "close") sheet(null);
  else if (k === "switcher") sheet("switcher");
  else if (k === "menu") sheet("menu");
  else if (k === "add") sheet("add");
  else if (k === "more") sheet("more");
  else if (k === "ref") sheet("ref");
  else if (k === "assign") sheet("assign");
  else if (k === "delveh") sheet("delveh", { id: a.dataset.id });
  else if (k === "export") sheet("export", { scope: a.dataset.scope });
  else if (k === "note") sheet("note", { whole: !!a.dataset.whole });
  else if (k === "switchto") { S.veh = a.dataset.id; S.sheet = null; draw(); toast(`Current Vehicle: ${veh().label}`); }
  else if (k === "toast") { sheet(null); toast(a.dataset.m); }
  else if (k === "sim") sim(a.dataset.k);
  else if (k === "simnext") S.sheet.after();
  else if (k === "newveh") sheet("newveh");
  else if (k === "ch") { S.on[a.dataset.k] = !S.on[a.dataset.k]; draw(); }
  else if (k === "look") { S.look = a.checked; draw(); }
  else if (k === "table") { S.table = !S.table; draw(); }
  else if (k === "opennote") { const j = +a.dataset.j; S.cur = Math.round(PINS[j].t / DT); updateCursor(); sheet("noteview", { j }); }
  else if (k === "seek") { S.cur = Math.round(+a.dataset.t / DT); updateCursor(); $("#chartbox").scrollIntoView({ behavior: "smooth", block: "center" }); }
  else if (k === "m6") { S.m6sort = a.dataset.s; draw(); }
  else if (k === "pack") { const id = S.vid || S.veh; S.packs[id][a.dataset.id] = a.checked; toast("Events regenerated for this Vehicle"); }
  else if (k === "selun") { a.checked ? S.selUn.add(a.dataset.id) : S.selUn.delete(a.dataset.id); draw(); }
});
document.addEventListener("change", (e) => { if (e.target.dataset.act === "cmp") { S.cmp = e.target.value; draw(); } });

// ===================================================================================
// prototype pill
// ===================================================================================
const VK = ["A", "D", "E", "F"];   // round 2: the A baseline against three researched references
function drawProto() { pLabel.innerHTML = `<em>PROTO</em>${S.v} · ${NAMES[S.v]}`; }
function cycle(d) { S.v = VK[(Math.max(0, VK.indexOf(S.v)) + d + VK.length) % VK.length]; draw(); console.log("state", { variant: S.v, route: S.route, theme: S.theme }); }
pPrev.onclick = () => cycle(-1); pNext.onclick = () => cycle(1);
pTheme.onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; draw(); };
pMenu.onclick = () => {
  const m = $("#pmenu"); if (!m.hidden) { m.hidden = true; return; }
  const J = [["Screens", [["recent", "Recent"], ["reports", "Reports list"], ["logs", "Drive Logs list"], ["log", "Drive Log viewer"], ["report", "Diagnostic Report viewer"], ["vehicles", "Vehicles"], ["vsettings", "Vehicle settings (Rule Packs)"], ["unassigned", "Unassigned"], ["ulog", "Unassigned Drive Log viewer"], ["failed", "Failed Uploads"]]],
    ["Sheets", [["@switcher", "Current Vehicle switcher"], ["@menu", "Menu"], ["@add", "Upload: pick a batch"], ["@which", "Which Vehicle?"], ["@result", "Batch result (messy)"], ["@newveh", "New vehicle added"], ["@export", "Export"], ["@note", "Note"], ["@ref", "Reference Report"], ["@delveh", "Delete vehicle"]]],
    ["Data", [["!empty", "Toggle: Current Vehicle with no report"]]]];
  m.innerHTML = J.map(([h, xs]) => `<div class="h">${h}</div>${xs.map(([k, l]) => `<button data-j="${k}">${l}</button>`).join("")}`).join("");
  m.hidden = false;
};
pmenu.onclick = (e) => {
  const b = e.target.closest("[data-j]"); if (!b) return; pmenu.hidden = true;
  const j = b.dataset.j;
  if (j[0] === "@") { const n = j.slice(1);
    if (n === "which") sheet("which", { n: 3, after: () => sheet(null) });
    else if (n === "result") sim("messy").then(() => {}), setTimeout(() => S.sheet?.after?.(), 50);
    else if (n === "delveh") sheet("delveh", { id: S.veh });
    else sheet(n, { scope: "vehicle" }); }
  else if (j === "!empty") { const r = REPORTS.filter((x) => x.veh === "civic"); if (r.length) { REPORTS.splice(REPORTS.indexOf(r[0]), 1); toast("Civic now has no report; switch to it"); } else toast("Already empty"); }
  else { S.stack = TABS.includes(j) ? [] : [["log", "report"].includes(j) ? "recent" : j === "vsettings" ? "vehicles" : j === "ulog" ? "unassigned" : "recent"]; if (["vehicles", "unassigned", "failed"].includes(j)) S.stack = []; S.route = j; S.sheet = null; draw(); }
};
addEventListener("keydown", (e) => { if (e.target.closest("input,textarea,select,[contenteditable]")) return; if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); if (e.key === "Escape") sheet(null); });

draw();
</script>
