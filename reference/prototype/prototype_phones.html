<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · phone view</title>
<!-- PROTOTYPE, throwaway. The three prototype_app_shell.html variants side by side in phone-sized frames
     (390 x 844, an iPhone 14/15). Each frame is live. Serve over http, see prototype_app_shell.html. -->
<style>
  body { margin: 0; background: #2a2a2a; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 14px 20px 0; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 15px; } header em { font-style: normal; color: #f5c84b; font-weight: 700; }
  header label { margin-left: auto; }
  .row { display: flex; gap: 28px; padding: 16px 20px 30px; overflow-x: auto; }
  figure { margin: 0; flex: none; }
  figcaption { font-weight: 600; margin-bottom: 8px; } figcaption span { color: #aaa; font-weight: 400; }
  .phone { width: 390px; height: 844px; border-radius: 44px; border: 12px solid #0b0b0b; background: #0b0b0b; overflow: hidden;
           box-shadow: 0 0 0 2px #444, 0 20px 50px rgba(0,0,0,.5); transform-origin: top left; }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 32px; background: #fff; display: block; }
</style>
</head>
<body>
<header><b><em>PROTOTYPE</em> OBD viewer on a phone</b><span>Each frame is live: tap, scroll, open things.</span>
  <label>Scale <select id="sc"><option value="1">100%</option><option value="0.8">80%</option><option value="0.65">65%</option><option value="0.5">50%</option></select></label></header>
<div class="row" id="row"></div>
<script>
const V = [["A", "Top tabs"], ["B", "Library sidebar"], ["C", "Day timeline + doc tabs"], ["D", "Bottom tab bar"]];
for (const [k, name] of V) {
  const fig = document.createElement("figure"), cap = document.createElement("figcaption"), wrap = document.createElement("div"), ph = document.createElement("div"), f = document.createElement("iframe");
  cap.append(`${k}: `, Object.assign(document.createElement("span"), { textContent: name }));
  ph.className = "phone"; f.src = `prototype_app_shell.html?variant=${k}&bare`; f.title = name;
  ph.append(f); wrap.append(ph); fig.append(cap, wrap); row.append(fig);
}
function scale() {
  const s = +sc.value;
  for (const w of row.querySelectorAll("figure > div")) { w.style.width = 414 * s + "px"; w.style.height = 868 * s + "px"; w.firstChild.style.transform = `scale(${s})`; }
}
sc.value = innerWidth >= 1800 ? "1" : innerWidth >= 1450 ? "0.8" : innerWidth >= 1200 ? "0.65" : "0.5";   // fit all four if possible
sc.onchange = scale; scale();
</script>
</body>
</html>
