name: Feature request
description: Suggest a new feature or a change.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Tell us how it could work. This part is optional.
