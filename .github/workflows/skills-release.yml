# Weekly check for a mattpocock/skills release newer than the skills vendored in .claude/skills/.
name: skills-release

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-skills-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
