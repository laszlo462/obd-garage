# Reusable workflow: build the image (amd64) and push it to GHCR.
# Without a version it publishes :develop. With a version it publishes the release tags.
# Both cases also publish :sha-<short>.
# It is a reusable workflow because a tag made with GITHUB_TOKEN cannot start another workflow.
name: docker-publish

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Empty means the commit that started the caller.
        type: string
        default: ""
      version:
        description: Release version X.Y.Z. Empty means a develop build.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Work out the release tags
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Placeholder values keep the disabled tag rules valid in a develop build.
          V="${VERSION:-0.0.0}"
          echo "full=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=develop,enable=${{ steps.ver.outputs.release != 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.full }},enable=${{ steps.ver.outputs.release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.release == 'true' }}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
